name: "setup-uv-env"
description: "Composite action to set up Python and the uv environment."

inputs:
  python-version:
    required: false
    description: "The python version to use"
    default: "3.13"

runs:
  using: "composite"
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        python-version: ${{ inputs.python-version }}

    - name: Install dependencies
      run: uv sync --locked
      shell: bash
