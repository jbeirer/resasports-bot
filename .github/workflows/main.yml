name: Main

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Set up the environment
        uses: ./.github/actions/setup-uv-env

      - name: Run checks
        run: make check

  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']
      fail-fast: false
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up the environment
        uses: ./.github/actions/setup-uv-env
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run offline tests
        run: make test

      - name: Upload coverage reports to Codecov with GitHub Actions
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  test-live:
    # Fork and Dependabot PRs have no access to the repository secrets
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up the environment
        uses: ./.github/actions/setup-uv-env
        with:
          python-version: '3.14'

      - name: Run live API tests
        env:
          SPORTBOT_EMAIL: ${{ secrets.SPORTBOT_EMAIL }}
          SPORTBOT_PASSWORD: ${{ secrets.SPORTBOT_PASSWORD }}
          SPORTBOT_CENTRE: ${{ secrets.SPORTBOT_CENTRE }}
        run: |
          # Fail instead of silently skipping when the secrets are not configured
          for var in SPORTBOT_EMAIL SPORTBOT_PASSWORD SPORTBOT_CENTRE; do
            if [ -z "${!var}" ]; then
              echo "::error::$var is not set"
              exit 1
            fi
          done
          make test-live

  check-docs:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up the environment
        uses: ./.github/actions/setup-uv-env

      - name: Check if documentation can be built
        run: uv run mkdocs build -s
