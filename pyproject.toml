[project]
name = "pysportbot"
version = "0.0.1"
description = "A python-based bot for automatic resasports slot booking"
authors = [
  { name = "Joshua Falco Beirer", email = "jbeirer@cern.ch" }
]
repository = "https://github.com/jbeirer/resasports-bot"
documentation = "https://jbeirer.github.io/resasports-bot/"
readme = "README.md"
packages = [
  { include = "pysportbot" }
]
dynamic = ["requires-python", "dependencies"]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
requests = "^2.34.2"
pandas = "^3.0.5"
pytz = "^2026.3"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-cov = "^7.1.0"
deptry = "^0.25.1"
mypy = "^2.3.1"
pre-commit = "^4.6.2"
tox = "^4.60.1"
ipykernel = "^7.3.0"
types-pytz = "^2026.3.1.20260727"
types-requests = "^2.33.0.20260712"

[tool.poetry.group.docs.dependencies]
mkdocs = "^1.6.1"
mkdocs-material = "^9.7.7"
mkdocstrings = {extras = ["python"], version = "^1.0.6"}

[build-system]
requires = ["poetry-core>=2.4.1"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120
target-version = ['py313']
preview = true

[tool.mypy]
files = ["pysportbot"]
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true
ignore_missing_imports= true
disallow_any_unimported = false


[tool.pytest.ini_options]
testpaths = ["tests"]
# filter deprecation warnings from external packages
filterwarnings = [
    "ignore::DeprecationWarning:(?!pysportbot).*",
]

[tool.ruff]
target-version = "py313"
line-length = 120
fix = true

[tool.ruff.lint]
select = [
    # flake8-2020
    "YTT",
    # flake8-bandit
    "S",
    # flake8-bugbear
    "B",
    # flake8-builtins
    "A",
    # flake8-comprehensions
    "C4",
    # flake8-debugger
    "T10",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # mccabe
    "C90",
    # pycodestyle
    "E", "W",
    # pyflakes
    "F",
    # pygrep-hooks
    "PGH",
    # pyupgrade
    "UP",
    # ruff
    "RUF",
    # tryceratops
    "TRY",
]
ignore = [
    # LineTooLong
    "E501",
    # DoNotAssignLambda
    "E731",
    # Comparison to true should be 'if cond is true:'
    "E712",
    # Long exception message
    "TRY003",
    # Module shadows a Python standard-library module
    "A005",
    # Use `logging.exception` instead of `logging.error`
    "TRY400"
]

[tool.coverage.report]
skip_empty = true

[tool.coverage.run]
branch = true
source = ["pysportbot"]


[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
