[project]
name = "pysportbot"
version = "0.0.1" # overwritten at release time by `uv version`
description = "A python-based bot for automatic resasports slot booking"
authors = [
  { name = "Joshua Falco Beirer", email = "jbeirer@cern.ch" }
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.34.2",
  "tzdata>=2026.5",
  "urllib3>=2.0",
]

[project.scripts]
pysportbot = "pysportbot.cli:main"

[project.urls]
Repository = "https://github.com/jbeirer/resasports-bot"
Documentation = "https://jbeirer.github.io/resasports-bot/"

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "deptry>=0.25.1",
  "mypy>=2.3.1",
  "pre-commit>=4.6.2",
  "types-requests>=2.33.0.20260712",
  "responses>=0.26.3",
]
docs = [
  "mkdocs>=1.6.1",
  "mkdocs-material>=9.7.7",
  "mkdocstrings[python]>=1.0.6",
]

[tool.uv]
default-groups = ["dev", "docs"]
# mkdocstrings 1.0.6 is incompatible with pymdown-extensions 12 (Highlight.__init__ requires `md`)
constraint-dependencies = ["pymdown-extensions<12"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pysportbot"]

[tool.hatch.build.targets.sdist]
include = [
  "/pysportbot",
  "/tests",
  "/README.md",
  "/LICENSE",
]

[tool.mypy]
files = ["pysportbot"]
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true
ignore_missing_imports= true
disallow_any_unimported = false


[tool.deptry.per_rule_ignores]
# tzdata is never imported: zoneinfo falls back to it where there is no system time zone database (Windows, minimal containers)
DEP002 = ["tzdata"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: talks to the real Resasports API; needs SPORTBOT_EMAIL/SPORTBOT_PASSWORD/SPORTBOT_CENTRE"]
addopts = "-m 'not live'"
# filter deprecation warnings from external packages
filterwarnings = [
    "ignore::DeprecationWarning:(?!pysportbot).*",
]

[tool.ruff]
target-version = "py311"
line-length = 120
fix = true

[tool.ruff.lint]
select = [
    # flake8-2020
    "YTT",
    # flake8-bandit
    "S",
    # flake8-bugbear
    "B",
    # flake8-builtins
    "A",
    # flake8-comprehensions
    "C4",
    # flake8-debugger
    "T10",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # mccabe
    "C90",
    # pycodestyle
    "E", "W",
    # pyflakes
    "F",
    # pygrep-hooks
    "PGH",
    # pyupgrade
    "UP",
    # ruff
    "RUF",
    # tryceratops
    "TRY",
]
ignore = [
    # LineTooLong
    "E501",
    # DoNotAssignLambda
    "E731",
    # Comparison to true should be 'if cond is true:'
    "E712",
    # Long exception message
    "TRY003",
    # Module shadows a Python standard-library module
    "A005",
    # Use `logging.exception` instead of `logging.error`
    "TRY400"
]

[tool.coverage.report]
skip_empty = true

[tool.coverage.run]
branch = true
source = ["pysportbot"]


[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
